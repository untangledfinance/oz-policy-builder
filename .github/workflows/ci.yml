name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint and format (biome)
        run: bun run check

      # Builds run before the typecheck: the CLI and MCP packages resolve
      # @crediolabs/policy-synth types from its built dist/. The per-package
      # builds are also stricter than the root typecheck (declaration emit +
      # CJS build) and are what publishing runs, so they gate here anyway.
      - name: Build packages
        run: |
          bun run --cwd packages/policy-synth build
          bun run --cwd packages/policy-builder-cli build
          bun run --cwd packages/policy-builder-mcp build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # Dependency advisories. Fails the build on a known-vulnerable package so
      # a fresh advisory is caught here rather than by the auditor.
      - name: Audit dependencies
        run: bun audit

  contracts:
    name: Contracts (${{ matrix.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        crate:
          - policy-interpreter
          - test-blend-pool
    defaults:
      run:
        working-directory: contracts/${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned in rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/${{ matrix.crate }}

      - name: Format check
        run: cargo fmt --check

      - name: Lint (clippy)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      # The conformance suite is the cross-layer gate: the TypeScript
      # synthesiser's encoded fixtures must evaluate identically on the
      # Rust interpreter. Run it in release, matching how it is verified
      # locally.
      - name: Conformance (release)
        if: matrix.crate == 'policy-interpreter'
        run: cargo test --release --test conformance

      # A wasm-hash pin-parity check belongs here, but cannot work yet: the
      # release build is NOT reproducible. It bakes in the absolute CARGO_HOME
      # path, so the same source produces a different sha256 on every machine
      # (three builds of this tree gave three hashes: a local one, one with a
      # fresh CARGO_HOME, and CI's). Comparing hashes across machines would fail
      # for everyone but the person who last deployed.
      #
      # `--remap-path-prefix` fixes it and was verified to give byte-identical
      # wasm across differing source paths and CARGO_HOMEs. Adopting it changes
      # the hash, so it has to land together with a redeploy and re-pin. Until
      # then the pin's hash is unverifiable by rebuild - see the handover.
      - name: Build wasm
        if: matrix.crate == 'policy-interpreter'
        run: |
          rustup target add wasm32v1-none
          cargo build --release --target wasm32v1-none

      # RustSec advisories against the locked dependency set. Needs 0.22 or
      # later: the advisory database now carries CVSS 4.0 entries, and 0.21
      # fails to load the whole database when it meets one.
      - name: Audit dependencies
        if: matrix.crate == 'policy-interpreter'
        run: |
          cargo install cargo-audit --locked --version ^0.22
          cargo audit
