name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint and format (biome)
        run: bun run check

      # Builds run before the typecheck: the CLI and MCP packages resolve
      # @crediolabs/policy-synth types from its built dist/. The per-package
      # builds are also stricter than the root typecheck (declaration emit +
      # CJS build) and are what publishing runs, so they gate here anyway.
      - name: Build packages
        run: |
          bun run --cwd packages/policy-synth build
          bun run --cwd packages/policy-builder-cli build
          bun run --cwd packages/policy-builder-mcp build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # Dependency advisories. Fails the build on a known-vulnerable package so
      # a fresh advisory is caught here rather than by the auditor.
      - name: Audit dependencies
        run: bun audit

  contracts:
    name: Contracts (${{ matrix.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        crate:
          # Every contract that holds or gates value. The v3 pair was added
          # after this matrix and ran outside it: their unit tests existed and
          # never ran on a push, on the two contracts that stand between an
          # agent and custody's money.
          - policy-interpreter
          - custody-gate
          - execution-adapter
          - test-blend-pool
          # The session signer on an OZ smart account. It skips the format check
          # (see the step) and its wasm is pinned in contracts/prime/build-hashes.json.
          - prime-session
    defaults:
      run:
        working-directory: contracts/prime/stellar/${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned in rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/prime/stellar/${{ matrix.crate }}

      # prime-session is kept as written. rustfmt reflows its source from 37 to 50
      # lines, which changes the size the docs state for it, and the line shift
      # changes the reproducible wasm (build-wasm.sh) even though the deployed
      # stellar contract build wasm keeps its hash.
      - name: Format check
        if: matrix.crate != 'prime-session'
        run: cargo fmt --check

      - name: Lint (clippy)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      # The conformance suite is the cross-layer gate: the TypeScript
      # synthesiser's encoded fixtures must evaluate identically on the
      # Rust interpreter. Run it in release, matching how it is verified
      # locally.
      - name: Conformance (release)
        if: matrix.crate == 'policy-interpreter'
        run: cargo test --release --test conformance

      # The source here is the grammar-6 line, and the instance that runs it is
      # recorded in deployments/grammar6-testnet.json. The package's
      # PINNED_INTERPRETER_WASM_SHA256 names the grammar-4 instances the npm
      # packages still target, so it is not this source's binary and comparing
      # the two fails for good. This rebuilds the wasm and compares it with the
      # record, so a source change that was never deployed turns this red.
      #
      # It must go through build-wasm.sh. A bare cargo build is NOT reproducible:
      # rustc bakes in the crate root and registry paths, so the hash differs per
      # machine. The script remaps both, which was verified to give a
      # byte-identical wasm across differing source paths and CARGO_HOMEs - that
      # is what makes comparing hashes in CI meaningful rather than flaky. The
      # current testnet instance predates that rule, so its record also carries
      # the reproducible hash of the commit it was built from, and that is what
      # this compares when present.
      - name: Wasm build and pin parity
        if: matrix.crate == 'policy-interpreter'
        run: |
          rustup target add wasm32v1-none
          built=$(./build-wasm.sh | tail -1)
          record=../../../../deployments/grammar6-testnet.json
          pinned=$(jq -r '.interpreterSource.reproducibleWasmSha256 // .wasmHashes.interpreter // empty' "$record")
          echo "built:  $built"
          echo "pinned: $pinned"
          if [ -z "$pinned" ]; then
            echo "could not read the interpreter hash from $record"
            exit 1
          fi
          if [ "$built" != "$pinned" ]; then
            echo ""
            echo "The recorded grammar-6 interpreter is not the wasm this tree builds."
            echo "Either the contract changed without a redeploy, or a redeploy did"
            echo "not update $record. Deploy the current build with"
            echo "scripts/deploy-grammar6-testnet.ts and re-pin the app together."
            echo "A reflow by rustfmt counts: the wasm embeds every panic's line."
            exit 1
          fi

      # The gate and the adapter are not shared instances - each custody account
      # deploys its own gate, each Prime its own adapter - so what is recorded is
      # the uploaded code, in deployments/execution-testnet.json, and the Prime
      # app pins those hashes. Same rule as the interpreter: a source change that
      # was never uploaded and re-pinned turns this red.
      - name: Wasm build and record parity
        if: matrix.crate == 'custody-gate' || matrix.crate == 'execution-adapter'
        run: |
          rustup target add wasm32v1-none
          built=$(./build-wasm.sh | tail -1)
          record=../../../../deployments/execution-testnet.json
          pinned=$(jq -r --arg c "${{ matrix.crate }}" '.wasmSha256[$c] // empty' "$record")
          echo "built:  $built"
          echo "pinned: $pinned"
          if [ "$built" != "$pinned" ]; then
            echo ""
            echo "The recorded ${{ matrix.crate }} build is not the wasm this tree builds."
            echo "Upload the current builds with scripts/upload-execution-testnet.ts"
            echo "and re-pin the Prime app together."
            exit 1
          fi

      # The session signer is not deployed as a shared instance, so there is no
      # deployments/ record. Its reproducible build (build-wasm.sh, which remaps
      # the crate and registry paths) is pinned in contracts/prime/build-hashes.json.
      # The testnet instances run the stellar contract build wasm, whose hash
      # depends on the build machine's paths and cannot be compared here.
      - name: Wasm build and pin parity
        if: matrix.crate == 'prime-session'
        run: |
          rustup target add wasm32v1-none
          ./build-wasm.sh
          ../../check-build-hash.sh stellar/prime-session target/wasm32v1-none/release/prime_session.wasm

      # RustSec advisories against the locked dependency set. Needs 0.22 or
      # later: the advisory database now carries CVSS 4.0 entries, and 0.21
      # fails to load the whole database when it meets one.
      - name: Audit dependencies
        if: matrix.crate == 'policy-interpreter'
        run: |
          cargo install cargo-audit --locked --version ^0.22
          cargo audit

  # The EVM session contract. It imports three OpenZeppelin Contracts 5.4.0 files,
  # mapped by foundry.toml to lib/oz/, and lib/ stays out of git. The fetch below
  # is the one contracts/prime/README.md documents.
  evm-prime-session:
    name: Contracts (evm/prime-session)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts/prime/evm/prime-session
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.4

      - name: Fetch OpenZeppelin Contracts 5.4.0
        run: |
          npm pack @openzeppelin/contracts@5.4.0
          tar xzf openzeppelin-contracts-5.4.0.tgz
          mkdir -p lib/oz && cp -r package/utils package/interfaces lib/oz/

      - name: Build
        run: forge build

      - name: Test
        run: forge test

  # The two Solana programs build with the Solana CLI's cargo-build-sbf, pinned
  # to the release the hashes were recorded with. PRIME_CLUSTER is a compile-time
  # string that goes into the grant text a wallet signs, so each cluster has its
  # own .so; localnet is the one recorded here.
  #
  # No format check on purpose: the docs state the size of these sources as
  # written (84 and 33 lines), and rustfmt would grow the gate to 241 lines.
  solana:
    name: Contracts (solana/${{ matrix.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: prime-session
            artifact: prime_session.so
          - crate: custody-gate
            artifact: gate.so
    env:
      SOLANA_VERSION: v4.3.0
      # cargo-build-sbf builds with its own platform tools but asks cargo for
      # package metadata first. Without this the repo's rust-toolchain.toml
      # makes that call download Rust 1.97.1 and the wasm target for nothing.
      RUSTUP_TOOLCHAIN: stable
    defaults:
      run:
        working-directory: contracts/prime/solana/${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Solana toolchain
        id: solana-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana/install
            ~/.cache/solana
          key: solana-${{ env.SOLANA_VERSION }}-platform-tools

      - name: Install Solana toolchain
        if: steps.solana-cache.outputs.cache-hit != 'true'
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_VERSION}/install)"

      - name: Put the Solana CLI on PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/prime/solana/${{ matrix.crate }}

      - name: Build (cargo-build-sbf, localnet)
        run: PRIME_CLUSTER=localnet cargo-build-sbf -- --locked

      - name: Build parity
        run: ../../check-build-hash.sh solana/${{ matrix.crate }} target/deploy/${{ matrix.artifact }}

  # The NEAR signer. Its sources are kept as written, like the Solana programs,
  # so there is no format check.
  #
  # cargo-near's non-reproducible-wasm build embeds the registry and the Rust
  # standard library paths, so the same source gives other bytes on another
  # machine. The recorded hash is the wasm deployed at
  # signer.prime-spike-muwguc60.testnet, built under a toolchain directory named
  # stable. The remaps below write those two paths in their original form, so a
  # runner reproduces the deployed bytes. The toolchain is pinned to the stable
  # release the hash was recorded with (1.98.1) and keeps rust-src, which is
  # where the standard library path text comes from. cargo-near replaces its
  # default RUSTFLAGS when --env sets them, so -C link-arg=-s is restated.
  near:
    name: Contracts (near/prime-near-signer)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
    defaults:
      run:
        working-directory: contracts/prime/near/prime-near-signer
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown --component rust-src

      - name: Install cargo-near
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-installer.sh | sh
          cargo-near --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/prime/near/prime-near-signer

      - name: Build (cargo-near)
        run: |
          sysroot="$(rustc --print sysroot)"
          registry="${CARGO_HOME:-$HOME/.cargo}/registry/src"
          cargo-near near build non-reproducible-wasm --no-abi --locked \
            --env "RUSTFLAGS=-C link-arg=-s --remap-path-prefix=${sysroot}=/home/ubuntu/.rustup/toolchains/stable-x86_64-unknown-linux-gnu --remap-path-prefix=${registry}=/home/ubuntu/.cargo/registry/src"

      - name: Build parity
        run: ../../check-build-hash.sh near/prime-near-signer target/near/prime_near_signer.wasm

  # The Prime app's checks around a gate-owned token account. They carry their own
  # dependencies and lockfile: the root bunfig.toml limits bun test to packages/.
  app-checks:
    name: TypeScript (solana/custody-gate/app-checks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: contracts/prime/solana/custody-gate/app-checks
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck (strict)
        run: bun run typecheck

      - name: Test
        run: bun test
