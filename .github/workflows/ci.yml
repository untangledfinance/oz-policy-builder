name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint and format (biome)
        run: bun run check

      # Builds run before the typecheck: the CLI and MCP packages resolve
      # @crediolabs/policy-synth types from its built dist/. The per-package
      # builds are also stricter than the root typecheck (declaration emit +
      # CJS build) and are what publishing runs, so they gate here anyway.
      - name: Build packages
        run: |
          bun run --cwd packages/policy-synth build
          bun run --cwd packages/policy-builder-cli build
          bun run --cwd packages/policy-builder-mcp build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # Dependency advisories. Fails the build on a known-vulnerable package so
      # a fresh advisory is caught here rather than by the auditor.
      - name: Audit dependencies
        run: bun audit

  contracts:
    name: Contracts (${{ matrix.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        crate:
          - policy-interpreter
          - test-blend-pool
    defaults:
      run:
        working-directory: contracts/${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned in rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/${{ matrix.crate }}

      - name: Format check
        run: cargo fmt --check

      - name: Lint (clippy)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      # The conformance suite is the cross-layer gate: the TypeScript
      # synthesiser's encoded fixtures must evaluate identically on the
      # Rust interpreter. Run it in release, matching how it is verified
      # locally.
      - name: Conformance (release)
        if: matrix.crate == 'policy-interpreter'
        run: cargo test --release --test conformance

      # The wasm is what actually gets deployed, and PINNED_INTERPRETER_WASM_SHA256
      # is the builder's claim about which binary the pinned instances run. The
      # grammar-version guard in grammar-version-parity.test.ts only compares the
      # VERSION, so a stale hash alongside a correct version would pass it. This
      # compares the pin against a wasm built from this tree.
      #
      # Safe to compare by hash: the build is reproducible. Rebuilding from a
      # different source path AND a different CARGO_TARGET_DIR was verified to
      # produce a byte-identical wasm, so a CI checkout path does not move it.
      - name: Wasm build and pin parity
        if: matrix.crate == 'policy-interpreter'
        run: |
          rustup target add wasm32v1-none
          cargo build --release --target wasm32v1-none
          built=$(sha256sum target/wasm32v1-none/release/policy_interpreter.wasm | cut -d' ' -f1)
          pinned=$(grep -A2 'PINNED_INTERPRETER_WASM_SHA256' \
            ../../packages/policy-synth/src/run/schemas.ts \
            | grep -oE '[0-9a-f]{64}' | head -1)
          echo "built:  $built"
          echo "pinned: $pinned"
          if [ -z "$pinned" ]; then
            echo "could not read PINNED_INTERPRETER_WASM_SHA256 - has it been renamed?"
            exit 1
          fi
          if [ "$built" != "$pinned" ]; then
            echo ""
            echo "The pinned wasm hash is not the wasm this tree builds."
            echo "Either the contract changed without a redeploy, or a deployment"
            echo "re-pinned the address and version but not the hash. Deploy the"
            echo "current build and re-pin address, wasm hash and grammar version"
            echo "together in run/schemas.ts."
            exit 1
          fi

      # RustSec advisories against the locked dependency set. Needs 0.22 or
      # later: the advisory database now carries CVSS 4.0 entries, and 0.21
      # fails to load the whole database when it meets one.
      - name: Audit dependencies
        if: matrix.crate == 'policy-interpreter'
        run: |
          cargo install cargo-audit --locked --version ^0.22
          cargo audit
