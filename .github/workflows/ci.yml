name: CI

# Pushes to main and to feat/primex (the integration branch for Prime on EVM and
# Solana) run CI on the merged commit; every pull request runs it
# whatever its base.
on:
  push:
    branches: [main, feat/primex]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint and format (biome)
        run: bun run check

      # Builds run before the typecheck: the CLI and MCP packages resolve
      # @crediolabs/policy-synth types from its built dist/. The per-package
      # builds are also stricter than the root typecheck (declaration emit +
      # CJS build) and are what publishing runs, so they gate here anyway.
      - name: Build packages
        run: |
          bun run --cwd packages/policy-synth build
          bun run --cwd packages/policy-builder-cli build
          bun run --cwd packages/policy-builder-mcp build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # What each package's prepublish runs: its own tests, alone, in its own directory.
      # A test that only passes after another file warmed a process-wide cache fails here.
      - name: Test each package alone
        run: bun run test:isolated

      # Dependency advisories. Fails the build on a known-vulnerable package so
      # a fresh advisory is caught here rather than by the auditor.
      - name: Audit dependencies
        run: bun audit

  contracts:
    name: Contracts (${{ matrix.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        crate:
          # Every contract that holds or gates value, including the gate and
          # the adapter: the two contracts that stand between an agent and
          # custody's money run their unit tests on every push.
          - policy-interpreter
          - custody-gate
          - execution-adapter
          - test-blend-pool
          # The Prime seat on an OZ smart account, held by an ed25519 owner
          # key, which also serves that owner's session keys. Its wasm is
          # pinned in contracts/build-hashes.json.
          - prime-seat
    defaults:
      run:
        working-directory: contracts/stellar/${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned in rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/stellar/${{ matrix.crate }}

      - name: Format check
        run: cargo fmt --check

      - name: Lint (clippy)
        run: cargo clippy --all-targets -- -D warnings

      # tests/worst_case.rs installs the largest rules into the REAL wasm and fails
      # without one, so the wasm is built first (build-wasm.sh, the reproducible
      # build). Only the interpreter has that test.
      - name: Build wasm for the worst-case test
        if: matrix.crate == 'policy-interpreter'
        run: |
          rustup target add wasm32v1-none
          ./build-wasm.sh

      # contracts/assert-tests.sh fails the step when it ran fewer tests than
      # the minimum or skipped any, so a crate cannot pass with zero tests.
      # test-blend-pool is the one exception: a testnet stand-in for a Blend
      # pool that holds nothing and has no tests of its own.
      - name: Test
        run: |
          min=1
          if [ "${{ matrix.crate }}" = test-blend-pool ]; then min=0; fi
          ../../assert-tests.sh "$min" cargo test

      # The conformance suite: fixed predicate and context cases the interpreter
      # must keep deciding the same way. (The cross-layer gate for the TypeScript
      # codec is tests/parity.rs, run by `cargo test` above: it fails when
      # packages/policy-synth/fixtures/parity/grammar.json is stale.) Run it in
      # release, matching how it is verified locally.
      - name: Conformance (release)
        if: matrix.crate == 'policy-interpreter'
        run: ../../assert-tests.sh 1 cargo test --release --test conformance

      # The interpreter's reproducible build is pinned in
      # contracts/build-hashes.json, the same way as the adapter's below. The
      # instance that runs on testnet is recorded separately in
      # deployments/interpreter-testnet.json (and pinned by
      # packages/policy-synth/src/config.ts); it runs this build. A source
      # change needs a new instance (no upgrade path) and a new pin.
      #
      # It must go through build-wasm.sh. A bare cargo build is NOT reproducible:
      # rustc bakes in the crate root and registry paths, so the hash differs per
      # machine. The script remaps both, which was verified to give a
      # byte-identical wasm across differing source paths and CARGO_HOMEs - that
      # is what makes comparing hashes in CI meaningful rather than flaky.
      # A reflow by rustfmt counts: the wasm embeds every panic's line.
      - name: Wasm build and pin parity
        if: matrix.crate == 'policy-interpreter'
        run: |
          rustup target add wasm32v1-none
          ./build-wasm.sh
          ../../check-build-hash.sh stellar/policy-interpreter target/wasm32v1-none/release/policy_interpreter.wasm

      # The pinned wasm against OpenZeppelin's smart account 0.8.0. That account
      # is built against soroban-sdk 28, whose wasm the soroban-sdk 27 test host
      # above refuses, so oz08/ is a crate of its own with a protocol-28 host
      # that loads the build the step above checked.
      # tests/nogate.rs also loads the execution adapter's wasm, built here
      # the same reproducible way and checked against its pin.
      - name: OpenZeppelin 0.8.0 suite (oz08)
        if: matrix.crate == 'policy-interpreter'
        working-directory: contracts/stellar/policy-interpreter/oz08
        run: |
          (cd ../../execution-adapter && ./build-wasm.sh && ../../check-build-hash.sh stellar/execution-adapter target/wasm32v1-none/release/execution_adapter.wasm)
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          ../../../assert-tests.sh 1 cargo test --locked

      # The gate is not a shared instance - each custody account deploys its
      # own - so what is recorded is the uploaded code, in
      # deployments/execution-testnet.json, and the Prime app pins that hash.
      # Same rule as the interpreter: a source change that was never uploaded
      # and re-pinned turns this red.
      - name: Wasm build and record parity
        if: matrix.crate == 'custody-gate'
        run: |
          rustup target add wasm32v1-none
          built=$(./build-wasm.sh | tail -1)
          record=../../../deployments/execution-testnet.json
          pinned=$(jq -r --arg c "${{ matrix.crate }}" '.wasmSha256[$c] // empty' "$record")
          echo "built:  $built"
          echo "pinned: $pinned"
          if [ "$built" != "$pinned" ]; then
            echo ""
            echo "The recorded ${{ matrix.crate }} build is not the wasm this tree builds."
            echo "Upload the current builds with scripts/upload-execution-testnet.ts"
            echo "and re-pin the Prime app together."
            exit 1
          fi

      # The seat is not deployed as a shared instance: the Prime app deploys one
      # per owner and account, so there is no deployments/ record. Its
      # reproducible build (build-wasm.sh, which remaps the crate and registry
      # paths) is pinned in contracts/build-hashes.json, and the app pins the
      # same hash. So is the adapter's, which deployments/execution-testnet.json
      # also records as uploaded to testnet.
      - name: Wasm build and pin parity
        if: matrix.crate == 'prime-seat' || matrix.crate == 'execution-adapter'
        run: |
          rustup target add wasm32v1-none
          ./build-wasm.sh
          wasm="${{ matrix.crate }}"
          ../../check-build-hash.sh "stellar/${wasm}" "target/wasm32v1-none/release/${wasm//-/_}.wasm"

      # RustSec advisories against the locked dependency set. Needs 0.22 or
      # later: the advisory database now carries CVSS 4.0 entries, and 0.21
      # fails to load the whole database when it meets one.
      - name: Audit dependencies
        if: matrix.crate == 'policy-interpreter'
        run: |
          cargo install cargo-audit --locked --version ^0.22
          cargo audit

  # PrimeSeat, the EVM seat: a Safe owner for one seat owner on one Prime
  # Account (Safe + Zodiac Roles). Built with the Foundry release and the
  # OpenZeppelin Contracts package the hashes were recorded with. Its runtime and
  # creation code are pinned in contracts/build-hashes.json, so a source change
  # that is not re-recorded turns this red. The contract's metadata hash covers
  # its source, comments included. The real-Safe tests run only with FORK_URL
  # set: this job forks Base Sepolia through the public RPC (read-only, no
  # secret), and the test step fails if any test skips, so the 7 tests on real
  # Safe 1.4.1 and 1.5.0 always run. There is no persistent deployment;
  # deployments/evm-testnet.json records that and the hashes below.
  evm-prime-seat:
    name: Contracts (evm/prime-seat)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts/evm/prime-seat
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.4

      - name: Fetch OpenZeppelin Contracts 5.4.0
        run: |
          npm pack @openzeppelin/contracts@5.4.0
          tar xzf openzeppelin-contracts-5.4.0.tgz
          mkdir -p lib/oz && cp -r package/utils package/interfaces lib/oz/

      # The test files are not formatted, so the check covers the contract.
      - name: Format check
        run: forge fmt --check src

      - name: Build
        run: forge build

      - name: Test (unit, and the real-Safe suite on a Base Sepolia fork)
        env:
          FORK_URL: https://sepolia.base.org
        run: ../../assert-tests.sh 1 forge test

      - name: Build hash parity
        run: |
          ../../check-build-hash.sh evm/prime-seat:runtime out/PrimeSeat.sol/PrimeSeat.json
          ../../check-build-hash.sh evm/prime-seat:creation out/PrimeSeat.sol/PrimeSeat.json

      # The record must state the pinned hashes, and its template hash must be
      # the keccak-256 of this build's runtime with every immutable zeroed: the
      # value an app compares a deployed seat against.
      - name: Deployment record parity (deployments/evm-testnet.json)
        run: |
          record=../../../deployments/evm-testnet.json
          hashes=../../build-hashes.json
          out=out/PrimeSeat.sol/PrimeSeat.json
          fail=0
          for kind in runtime creation; do
            want=$(jq -r --arg k "evm/prime-seat:$kind" '.sha256[$k]' "$hashes")
            got=$(jq -r --arg k "${kind}Sha256" '.contracts["prime-seat"][$k]' "$record")
            echo "$kind: record $got, build-hashes $want"
            [ "$got" = "$want" ] || fail=1
          done
          zeroed=$(jq -r '.deployedBytecode as $d
            | reduce ($d.immutableReferences | [.[][]] | .[]) as $r ($d.object;
                .[0:(2 + 2 * $r.start)] + ("0" * (2 * $r.length)) + .[(2 + 2 * ($r.start + $r.length)):])' "$out")
          template=$(cast keccak "$zeroed")
          slots=$(jq '.deployedBytecode.immutableReferences | [.[][]] | length' "$out")
          recorded=$(jq -r '.contracts["prime-seat"].template.zeroedRuntimeKeccak256' "$record")
          rslots=$(jq -r '.contracts["prime-seat"].template.immutableSlots' "$record")
          echo "template: built $template ($slots slots), record $recorded ($rslots slots)"
          [ "$template" = "$recorded" ] && [ "$slots" = "$rslots" ] || fail=1
          if [ "$fail" != 0 ]; then
            echo "deployments/evm-testnet.json does not match this build."
            exit 1
          fi

  # The mutation pass of contracts/evm/prime-seat/mutate.py: 128 mutants of
  # PrimeSeat.sol, each run against the whole suite on the Base Sepolia fork
  # (about ten minutes). A mutant counts as killed when the suite fails or the
  # build breaks. Exactly three survive, each with no effect on behaviour (the
  # contract's README says why); any other survivor, or a missing survivor
  # (the suite changed), fails the job.
  evm-prime-seat-mutants:
    name: Contracts (evm/prime-seat mutation pass)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contracts/evm/prime-seat
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.4

      - name: Fetch OpenZeppelin Contracts 5.4.0
        run: |
          npm pack @openzeppelin/contracts@5.4.0
          tar xzf openzeppelin-contracts-5.4.0.tgz
          mkdir -p lib/oz && cp -r package/utils package/interfaces lib/oz/

      - name: Mutation pass
        env:
          FORK_URL: https://sepolia.base.org
        run: |
          # mutate.py exits 1 while any mutant survives; the survivors are checked below.
          python3 mutate.py mutants.json || true
          jq -r '.[] | .[1]' mutants.json | sort | uniq -c
          survivors=$(jq -c '[.[] | select(.[1] | startswith("KILLED") | not) | .[0]] | sort' mutants.json)
          expected='["exec digest drops op","exec: op dropped","grant: revert text"]'
          echo "mutants: $(jq length mutants.json), not killed: $survivors"
          if [ "$(jq length mutants.json)" -lt 128 ] || [ "$survivors" != "$expected" ]; then
            echo "Expected 128 or more mutants and exactly these survivors: $expected"
            exit 1
          fi
