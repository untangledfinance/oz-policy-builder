name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint and format (biome)
        run: bun run check

      # Builds run before the typecheck: the CLI and MCP packages resolve
      # @crediolabs/policy-synth types from its built dist/. The per-package
      # builds are also stricter than the root typecheck (declaration emit +
      # CJS build) and are what publishing runs, so they gate here anyway.
      - name: Build packages
        run: |
          bun run --cwd packages/policy-synth build
          bun run --cwd packages/policy-builder-cli build
          bun run --cwd packages/policy-builder-mcp build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # What each package's prepublish runs: its own tests, alone, in its own directory.
      # A test that only passes after another file warmed a process-wide cache fails here.
      - name: Test each package alone
        run: bun run test:isolated

      # Dependency advisories. Fails the build on a known-vulnerable package so
      # a fresh advisory is caught here rather than by the auditor.
      - name: Audit dependencies
        run: bun audit

  contracts:
    name: Contracts (${{ matrix.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        crate:
          # Every contract that holds or gates value. The v3 pair was added
          # after this matrix and ran outside it: their unit tests existed and
          # never ran on a push, on the two contracts that stand between an
          # agent and custody's money.
          - policy-interpreter
          - custody-gate
          - execution-adapter
          - test-blend-pool
          # The NEAR-routed owner's seat on an OZ smart account, which also
          # serves that owner's session keys. Its wasm is pinned in
          # contracts/build-hashes.json.
          - prime-seat
    defaults:
      run:
        working-directory: contracts/stellar/${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned in rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/stellar/${{ matrix.crate }}

      - name: Format check
        run: cargo fmt --check

      - name: Lint (clippy)
        run: cargo clippy --all-targets -- -D warnings

      # tests/worst_case.rs installs the largest rules into the REAL wasm and fails
      # without one, so the wasm is built first (build-wasm.sh, the reproducible
      # build). Only the interpreter has that test.
      - name: Build wasm for the worst-case test
        if: matrix.crate == 'policy-interpreter'
        run: |
          rustup target add wasm32v1-none
          ./build-wasm.sh

      - name: Test
        run: cargo test

      # The conformance suite: fixed predicate and context cases the interpreter
      # must keep deciding the same way. (The cross-layer gate for the TypeScript
      # codec is tests/parity.rs, run by `cargo test` above: it fails when
      # packages/policy-synth/fixtures/parity/grammar7.json is stale.) Run it in
      # release, matching how it is verified locally.
      - name: Conformance (release)
        if: matrix.crate == 'policy-interpreter'
        run: cargo test --release --test conformance

      # The source here is the grammar-7 line, and the instance that runs it is
      # recorded in deployments/grammar7-testnet.json (testnet only; the npm
      # packages pin the same hash in packages/policy-synth/src/config.ts). This
      # rebuilds the wasm and compares it with the record, so a source change that
      # was never deployed turns this red.
      #
      # It must go through build-wasm.sh. A bare cargo build is NOT reproducible:
      # rustc bakes in the crate root and registry paths, so the hash differs per
      # machine. The script remaps both, which was verified to give a
      # byte-identical wasm across differing source paths and CARGO_HOMEs - that
      # is what makes comparing hashes in CI meaningful rather than flaky. The
      # current testnet instance predates that rule, so its record also carries
      # the reproducible hash of the commit it was built from, and that is what
      # this compares when present.
      - name: Wasm build and pin parity
        if: matrix.crate == 'policy-interpreter'
        run: |
          rustup target add wasm32v1-none
          built=$(./build-wasm.sh | tail -1)
          record=../../../deployments/grammar7-testnet.json
          pinned=$(jq -r '.interpreterSource.reproducibleWasmSha256 // .wasmHashes.interpreter // empty' "$record")
          echo "built:  $built"
          echo "pinned: $pinned"
          if [ -z "$pinned" ]; then
            echo "could not read the interpreter hash from $record"
            exit 1
          fi
          if [ "$built" != "$pinned" ]; then
            echo ""
            echo "The recorded grammar-7 interpreter is not the wasm this tree builds."
            echo "Either the contract changed without a redeploy, or a redeploy did"
            echo "not update $record. Deploy the current build with"
            echo "a redeploy and re-pin the config and the record together."
            echo "A reflow by rustfmt counts: the wasm embeds every panic's line."
            exit 1
          fi

      # The gate is not a shared instance - each custody account deploys its
      # own - so what is recorded is the uploaded code, in
      # deployments/execution-testnet.json, and the Prime app pins that hash.
      # Same rule as the interpreter: a source change that was never uploaded
      # and re-pinned turns this red.
      - name: Wasm build and record parity
        if: matrix.crate == 'custody-gate'
        run: |
          rustup target add wasm32v1-none
          built=$(./build-wasm.sh | tail -1)
          record=../../../deployments/execution-testnet.json
          pinned=$(jq -r --arg c "${{ matrix.crate }}" '.wasmSha256[$c] // empty' "$record")
          echo "built:  $built"
          echo "pinned: $pinned"
          if [ "$built" != "$pinned" ]; then
            echo ""
            echo "The recorded ${{ matrix.crate }} build is not the wasm this tree builds."
            echo "Upload the current builds with scripts/upload-execution-testnet.ts"
            echo "and re-pin the Prime app together."
            exit 1
          fi

      # The seat is not deployed as a shared instance: the Prime app deploys one
      # per owner and account, so there is no deployments/ record. Its
      # reproducible build (build-wasm.sh, which remaps the crate and registry
      # paths) is pinned in contracts/build-hashes.json, and the app pins the
      # same hash. So is the adapter's: the source here is the v5 build (an
      # optional gate), while deployments/execution-testnet.json keeps the v4
      # build 3dd675c0 that the Prime app pins and mainnet runs.
      - name: Wasm build and pin parity
        if: matrix.crate == 'prime-seat' || matrix.crate == 'execution-adapter'
        run: |
          rustup target add wasm32v1-none
          ./build-wasm.sh
          wasm="${{ matrix.crate }}"
          ../../check-build-hash.sh "stellar/${wasm}" "target/wasm32v1-none/release/${wasm//-/_}.wasm"

      # RustSec advisories against the locked dependency set. Needs 0.22 or
      # later: the advisory database now carries CVSS 4.0 entries, and 0.21
      # fails to load the whole database when it meets one.
      - name: Audit dependencies
        if: matrix.crate == 'policy-interpreter'
        run: |
          cargo install cargo-audit --locked --version ^0.22
          cargo audit

  # The EVM seat for a NEAR-routed owner. It imports one OpenZeppelin Contracts
  # 5.4.0 file, mapped by foundry.toml to lib/oz/, and lib/ stays out of git. The
  # fetch below is the one contracts/README.md documents. The runtime and
  # creation code are pinned in
  # contracts/build-hashes.json, so a source change that is not re-recorded
  # turns this red. The real-Safe tests run only with FORK_URL set (a Base Sepolia
  # fork, see the contract's README), which this job does not set.
  evm-prime-seat:
    name: Contracts (evm/prime-seat)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts/evm/prime-seat
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.4

      - name: Fetch OpenZeppelin Contracts 5.4.0
        run: |
          npm pack @openzeppelin/contracts@5.4.0
          tar xzf openzeppelin-contracts-5.4.0.tgz
          mkdir -p lib/oz && cp -r package/utils package/interfaces lib/oz/

      # The test files are not formatted, so the check covers the contract.
      - name: Format check
        run: forge fmt --check src

      - name: Build
        run: forge build

      - name: Test
        run: forge test

      - name: Build hash parity
        run: |
          python3 - <<'PY'
          import hashlib, json, sys
          art = json.load(open("out/PrimeSeat.sol/PrimeSeat.json"))
          pins = json.load(open("../../build-hashes.json"))["sha256"]
          bad = False
          for kind, field in (("runtime", "deployedBytecode"), ("creation", "bytecode")):
              built = hashlib.sha256(bytes.fromhex(art[field]["object"][2:])).hexdigest()
              pinned = pins.get("evm/prime-seat:" + kind, "")
              print(kind, "built: ", built)
              print(kind, "pinned:", pinned)
              if built != pinned:
                  print("The recorded evm/prime-seat:" + kind + " build is not what this tree builds.")
                  print("Update contracts/build-hashes.json together with the source and the README build table.")
                  bad = True
          sys.exit(1 if bad else 0)
          PY

  # The two Solana programs build with the Solana CLI's cargo-build-sbf, pinned
  # to the release the hashes were recorded with. PRIME_CLUSTER is a compile-time
  # string that goes into the seat's grant hash, so each cluster has its own
  # prime_seat.so; localnet is the one recorded here.
  #
  # The sources are rustfmt output, and the docs state their formatted size
  # (126 and 75 lines).
  solana:
    name: Contracts (solana/${{ matrix.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: custody-gate
            artifact: gate.so
          - crate: prime-seat
            artifact: prime_seat.so
    env:
      SOLANA_VERSION: v4.3.0
      # cargo-build-sbf builds with its own platform tools but asks cargo for
      # package metadata first. Without this the repo's rust-toolchain.toml
      # makes that call download Rust 1.97.1 and the wasm target for nothing.
      RUSTUP_TOOLCHAIN: stable
    defaults:
      run:
        working-directory: contracts/solana/${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Solana toolchain
        id: solana-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana/install
            ~/.cache/solana
          key: solana-${{ env.SOLANA_VERSION }}-platform-tools

      - name: Install Solana toolchain
        if: steps.solana-cache.outputs.cache-hit != 'true'
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_VERSION}/install)"

      - name: Put the Solana CLI on PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/solana/${{ matrix.crate }}

      - name: Format check
        run: cargo fmt --check

      - name: Build (cargo-build-sbf, localnet)
        run: PRIME_CLUSTER=localnet cargo-build-sbf -- --locked

      - name: Build parity
        run: ../../check-build-hash.sh solana/${{ matrix.crate }} target/deploy/${{ matrix.artifact }}

  # prime-near-signer v2, the signer behind every NEAR-routed seat key. Its code is
  # deployed at seats.prime-spike-muwguc60.testnet and the recorded hash is that
  # code. It builds with the repo's Rust (rust-toolchain.toml) and plain cargo:
  # --cfg near makes near-sdk use the host's hash functions, and -s strips the
  # symbols. The standard library paths in the wasm are /rustc/<commit> and do not
  # vary, but the registry path does, so the remap writes it in the form the
  # deployed build had. The tests read the shared vectors in ../vectors.
  near-v2:
    name: Contracts (near/prime-near-signer-v2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contracts/near/prime-near-signer-v2
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned in rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/near/prime-near-signer-v2

      - name: Format check
        run: cargo fmt --check

      - name: Lint (clippy)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build (wasm)
        run: |
          registry="${CARGO_HOME:-$HOME/.cargo}/registry/src"
          RUSTFLAGS="-C link-arg=-s --cfg near --remap-path-prefix=${registry}=/home/ubuntu/.cargo/registry/src" \
            cargo build --release --locked --target wasm32-unknown-unknown

      - name: Build parity
        run: ../../check-build-hash.sh near/prime-near-signer-v2 target/wasm32-unknown-unknown/release/prime_near_signer_v2.wasm

  # The shared vectors of prime-near-signer v2. The generator computes every text,
  # key path and hash with viem, @stellar/stellar-sdk, @solana/web3.js and @noble,
  # not with the contract's code; this regenerates requests.json and requires the
  # committed file byte for byte. Its lockfile was written by Bun 1.4, which 1.3
  # cannot read as frozen, so this job runs 1.4.2.
  near-vectors:
    name: TypeScript (near/vectors)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: contracts/near/vectors/generator
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Regenerate and compare
        run: |
          bun gen.ts "$RUNNER_TEMP/requests.json"
          cmp "$RUNNER_TEMP/requests.json" ../requests.json

  # The Prime app's checks around a gate-owned token account. They carry their own
  # dependencies and lockfile: the root bunfig.toml limits bun test to packages/.
  app-checks:
    name: TypeScript (solana/custody-gate/app-checks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: contracts/solana/custody-gate/app-checks
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck (strict)
        run: bun run typecheck

      - name: Test
        run: bun test
