[profile.default]
src = "src"
libs = ["lib"]
out = "out"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = ["@openzeppelin/contracts/=lib/oz/"]

# Lints that flag intended code (the source is hash-pinned, so no inline
# markers): block-timestamp, a grant is valid between its start and its end;
# unsafe-typecast, bytes2(data) reads the first two bytes of 66-byte data after
# the length check; unused-return, exec calls Roles with shouldRevert true, so
# a failed call reverts and the returned flag is always true. Lint settings do
# not reach solc, and the build hashes stay the same.
[lint]
exclude_lints = ["block-timestamp", "unsafe-typecast", "unused-return"]
