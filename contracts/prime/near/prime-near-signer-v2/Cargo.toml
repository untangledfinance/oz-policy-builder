[package]
name = "prime-near-signer-v2"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.29.0", features = ["unstable"] }
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.29.0", features = ["unit-testing", "unstable"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
