[package]
name = "session-signer"
version = "0.0.1"
edition = "2021"
publish = false
[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
[dependencies]
soroban-sdk = "=27.0.2"
[dev-dependencies]
soroban-sdk = { version = "=27.0.2", features = ["testutils"] }
k256 = { version = "0.13", features = ["ecdsa"] }
ed25519-dalek = "2"
sha2 = "0.10"
[profile.release]
opt-level = "z"
overflow-checks = true
panic = "abort"
codegen-units = 1
lto = true
strip = "symbols"
