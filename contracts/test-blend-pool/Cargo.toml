[package]
name = "test-blend-pool"
version = "0.1.0"
edition = "2021"
publish = false

# A Blend-`submit`-shaped stub for TESTNET VERIFICATION ONLY.
#
# The real Blend pool on Stellar mainnet exports `submit(from, spender, to,
# requests)` where `requests: Vec<Request>` and each `Request` is a
# `#[contracttype]` struct. The OZ account's `__check_auth` only consults
# the policy when the auth context is non-empty - so the OZ-account test
# path needs a target that calls `from.require_auth` (or
# `require_auth_for_args`), which is what makes the call generate an auth
# context the interpreter's `enforce` is asked to evaluate.
#
# This stub serves that role on testnet. It is NOT a production pool:
#   - `from` is whichever address must authorise: a G... keypair, or the
#     C... smart account when the point is to exercise its `__check_auth`.
#   - each request pulls its own token, so the auth tree is `submit` with a
#     nested `transfer` - the two-context shape a real Blend supply has,
#     confirmed by decoding the mainnet envelopes. An empty request vector
#     moves nothing, so a caller holding no balance can still generate the
#     auth context alone.
#   - it does not read `request_type`, keep per-reserve accounting, issue
#     bTokens, or let anyone withdraw. Tokens sent here are unrecoverable.
#   - any test deployment is keyed by a fresh wasm hash, so a build
#     pointing here is structurally distinct from a mainnet Blend build.
#
# Two instances (different addresses) make a meaningful evil-twin test
# (the same `submit` call against a different target contract is what the
# interpreter policy must DENY).

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { version = "27.0.2", features = ["alloc"] }

[dev-dependencies]
soroban-sdk = { version = "27.0.2", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = false
panic = "abort"
codegen-units = 1
lto = true
