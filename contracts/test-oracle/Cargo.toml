[package]
name = "test-oracle"
version = "0.1.0"
edition = "2021"
publish = false

# A Reflector-Pulse-compatible price feed for TESTNET VERIFICATION ONLY.
# Never deployed to mainnet - the interpreter pins the real Reflector feed
# there. See src/lib.rs.

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { version = "27.0.2", features = ["alloc"] }

[dev-dependencies]
soroban-sdk = { version = "27.0.2", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = false
panic = "abort"
codegen-units = 1
lto = true
